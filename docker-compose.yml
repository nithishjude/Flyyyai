services:
  postgres:
    image: postgres:16-alpine
    container_name: aiassets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiassets
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d aiassets"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiassets-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aiuser:aipass@postgres:5432/aiassets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiassets-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
