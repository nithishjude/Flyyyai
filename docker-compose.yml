services:
  postgres:
    image: postgres:16-alpine
    container_name: aiassets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiassets
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d aiassets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
